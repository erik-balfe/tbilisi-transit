name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "for (const f of require('fs').readdirSync('.').filter(f=>/^app.*\.js$|^sw\.js$/.test(f))) new Function(require('fs').readFileSync(f,'utf8'))"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: tools/assemble_site.sh _data _site
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
