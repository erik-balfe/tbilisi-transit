<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="Tbilisi trip planner — OSM map pins and Transitous routes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Tbilisi Transit</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="map" role="application" aria-label="Tbilisi map"></div>

  <div class="panel" id="panel" data-sheet="mid" data-mode="search" style="--sheet-h: 42dvh;">
    <div class="panel-handle" id="panel-handle" role="button" tabindex="0"
         aria-controls="panel-body" aria-expanded="true" title="Drag sheet">
      <span class="grip-bar" aria-hidden="true"></span>
      <div class="peek-row" id="peek-row">
        <span class="peek-text" id="peek-text">Tbilisi Transit</span>
        <span class="peek-action" id="peek-action" hidden></span>
      </div>
    </div>

    <div class="panel-body" id="panel-body">
      <header class="panel-header">
        <h1 id="title">Tbilisi Transit</h1>
        <div class="toolbar" role="group" aria-label="Language">
          <button type="button" class="chip lang active" id="lang-en" data-lang="en">EN</button>
          <button type="button" class="chip lang" id="lang-ka" data-lang="ka">KA</button>
        </div>
      </header>

      <div class="trip-summary" id="trip-summary" hidden>
        <button type="button" class="trip-summary-btn" id="edit-trip" title="Edit">
          <span class="trip-from" id="sum-from"></span>
          <span class="trip-arrow" aria-hidden="true">→</span>
          <span class="trip-to" id="sum-to"></span>
        </button>
        <button type="button" class="chip compact" id="edit-trip-chip">Edit</button>
      </div>

      <div class="card search-card" id="search-card">
        <div class="field" id="from-field">
          <div class="field-label-row">
            <label id="label-from" for="from">From</label>
            <button type="button" class="chip compact move-pin-btn" id="move-from" hidden>Move pin</button>
          </div>
          <div class="field-row">
            <span class="field-pin from" aria-hidden="true">A</span>
            <input id="from" type="text" autocomplete="off" spellcheck="false" placeholder="Freedom Square" />
            <button type="button" class="loc-btn" id="loc-from" title="My location" aria-label="My location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
              </svg>
            </button>
          </div>
          <div class="suggest" id="from-suggest" role="listbox"></div>
        </div>
        <div class="swap-row">
          <button type="button" class="swap-btn" id="swap" title="Swap" aria-label="Swap">⇅</button>
        </div>
        <div class="field" id="to-field">
          <div class="field-label-row">
            <label id="label-to" for="to">To</label>
            <button type="button" class="chip compact move-pin-btn" id="move-to" hidden>Move pin</button>
          </div>
          <div class="field-row">
            <span class="field-pin to" aria-hidden="true">B</span>
            <input id="to" type="text" autocomplete="off" spellcheck="false" placeholder="Station Square" />
            <button type="button" class="loc-btn" id="loc-to" title="My location" aria-label="My location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
              </svg>
            </button>
          </div>
          <div class="suggest" id="to-suggest" role="listbox"></div>
        </div>

        <p class="pin-hint" id="map-hint">Tap map to set From</p>

        <details class="more-tools" id="more-tools">
          <summary id="label-more">More</summary>
          <div class="more-body">
            <div class="paste-block">
              <label id="label-paste" for="paste">Paste a link</label>
              <input id="paste" type="text" autocomplete="off" spellcheck="false"
                     placeholder="geo:… · maps.google.com · openstreetmap.org" />
              <div class="paste-actions">
                <button type="button" class="chip" id="use-as-from">Use as start</button>
                <button type="button" class="chip" id="use-as-to">Use as destination</button>
              </div>
            </div>
            <div class="presets" id="presets">
              <span class="presets-label" id="label-examples">Examples</span>
              <button type="button" class="chip" id="preset-fs">Freedom → Station</button>
              <button type="button" class="chip" id="preset-sf">Station → Freedom</button>
            </div>
          </div>
        </details>

        <button type="button" class="btn-primary" id="go">Plan trip</button>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
      <div id="results"></div>

      <footer id="footer">
        <a href="https://transitous.org/" target="_blank" rel="noopener">Transitous</a>
        · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a>
      </footer>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="app-data.js"></script>
  <script src="app-ui.js"></script>
  <script src="app-map.js"></script>
  <script src="app-share.js"></script>
  <script src="app-plan.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
